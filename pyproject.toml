[project]
name = "vscode-2026-theme-zed"
version = "0.1.2"
description = "VS Code Dark 2026 and Light 2026 themes for Zed"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyjson5>=2.0.1",
    "tomlkit>=0.15.1",
]
authors = [{ name = "realSergiy" }]

[project.urls]
Repository = "https://github.com/realSergiy/vscode_2026_theme_zed"

[tool.zed-extension]
id = "vscode-2026-semantic-theme"
name = "VSCode 2026 Themes"
schema_version = 1

[dependency-groups]
dev = ["ruff>=0.16.0", "rumdl>=0.2.43", "pyrefly>=1.1.1"]

[tool.uv]
package = false
